<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DWE VIEWER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PDF.js 3.11.174 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent !important;
    }

    /* 양면 책 페이지 래퍼 */
    .page-wrapper {
      position: relative;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
      flex-shrink: 0;
    }
    
    .book-spine-left {
      box-shadow: inset -8px 0 14px -6px rgba(0, 0, 0, 0.15), 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .book-spine-right {
      box-shadow: inset 8px 0 14px -6px rgba(0, 0, 0, 0.15), 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    /* PDF 내부 하이퍼링크 레이어 (투명화 유지) */
    .link-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }
    .link-layer a {
      position: absolute;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      background: transparent !important;
      outline: none !important;
      -webkit-tap-highlight-color: transparent !important;
      -webkit-touch-callout: none !important;
    }

    /* 원형 음원 핫스팟 레이어 */
    .song-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 25;
      pointer-events: none;
    }
    .edit-active .song-layer {
      pointer-events: auto;
      cursor: crosshair;
      background-color: rgba(37, 99, 235, 0.04);
    }

    .song-circle {
      position: absolute;
      transform: translate(-50%, -50%);
      border-radius: 9999px;
      pointer-events: auto;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }

    /* 일반 모드 원형 버튼: 평소엔 투명, 터치 시 물결 피드백 */
    .song-circle:active {
      transform: translate(-50%, -50%) scale(0.92);
      background-color: rgba(37, 99, 235, 0.25);
    }
    .song-circle.playing {
      background-color: rgba(37, 99, 235, 0.18);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.45);
    }

    /* 편집 모드 원형 버튼: 위치와 번호 명확히 표시 */
    .edit-active .song-circle {
      background-color: rgba(37, 99, 235, 0.28);
      border: 2px dashed #1d4ed8;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
    }

    /* 하단 숨김형 페이지 네비게이터 */
    #bottom-nav-trigger {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      z-index: 40;
    }
    #bottom-nav-bar {
      transition: transform 0.25s ease, opacity 0.25s ease;
      transform: translateY(100%);
      opacity: 0;
      pointer-events: none;
    }
    #bottom-nav-trigger:hover #bottom-nav-bar,
    #bottom-nav-bar.active {
      transform: translateY(0);
      opacity: 1;
      pointer-events: auto;
    }

    input[type=range] {
      accent-color: #2563eb;
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-slate-100">

  <!-- 상단 패널 -->
  <header id="top-panel" class="h-12 bg-white border-b border-slate-200 px-3 sm:px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2">
      <span class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center text-xs shadow-xs">
        <i class="fa-solid fa-book-open"></i>
      </span>
      <span class="font-black text-slate-800 text-sm tracking-tight">DWE VIEWER</span>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- 편집 모드 도구 (편집 모드 켰을 때만 노출) -->
      <div id="edit-controls" class="hidden flex items-center gap-1 bg-amber-50 border border-amber-200 rounded-lg px-2 py-0.5 mr-1">
        <span class="text-[11px] font-bold text-amber-800 mr-1">원 크기:</span>
        <button onclick="changeDefaultRadius(-0.5)" class="w-5 h-5 rounded bg-white border border-amber-300 text-amber-800 font-black text-xs flex items-center justify-center">-</button>
        <span id="radius-display" class="text-[11px] font-mono font-bold text-amber-900 w-7 text-center">4.5%</span>
        <button onclick="changeDefaultRadius(0.5)" class="w-5 h-5 rounded bg-white border border-amber-300 text-amber-800 font-black text-xs flex items-center justify-center">+</button>
        <button onclick="exportSpotsJSON()" title="좌표 데이터 백업 다운로드" class="ml-1.5 px-2 py-0.5 rounded bg-amber-500 hover:bg-amber-600 text-white font-bold text-[11px]">
          저장
        </button>
      </div>

      <!-- 음원 편집 토글 -->
      <button id="btn-edit-spots" onclick="toggleSpotEditMode()" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold hover:bg-slate-200 transition">
        <i class="fa-solid fa-music mr-1 text-pink-600"></i><span id="label-edit">음원편집</span>
      </button>

      <!-- 2쪽보기 / 1쪽보기 -->
      <button id="btn-spread" onclick="toggleSpreadMode()" class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold hover:bg-blue-100 transition">
        <i class="fa-solid fa-columns mr-1"></i><span id="label-spread">2쪽보기</span>
      </button>

      <!-- 표지포함 / 표지미포함 -->
      <button id="btn-cover" onclick="toggleCoverMode()" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold hover:bg-slate-200 transition">
        <i class="fa-solid fa-bookmark mr-1 text-blue-600"></i><span id="label-cover">표지포함</span>
      </button>

      <!-- 전체화면 -->
      <button onclick="toggleFullscreen()" title="전체화면" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 flex items-center justify-center text-xs font-bold transition">
        <i id="fs-icon" class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- 전체보기 시 상단 터치 복귀 핫스팟 -->
  <div id="top-exit-hotspot" onclick="toggleFullscreen(false)" class="hidden fixed top-0 left-0 right-0 h-6 z-50 cursor-pointer" title="상단을 누르면 원래 화면으로 돌아옵니다"></div>

  <!-- 전체보기 시 플로팅 복귀 미니 버튼 -->
  <button id="btn-floating-exit" onclick="toggleFullscreen(false)" class="hidden fixed top-3 right-3 z-50 px-3 py-1.5 rounded-full bg-black/60 hover:bg-black/80 text-white text-xs font-bold backdrop-blur-md shadow-lg border border-white/20 transition">
    <i class="fa-solid fa-compress mr-1"></i> 복귀
  </button>

  <!-- 메인 뷰어 영역 -->
  <main id="viewer-container" class="flex-1 w-full h-full relative flex items-center justify-center p-2 sm:p-4 overflow-hidden">
    
    <div id="loading-box" class="flex flex-col items-center justify-center text-slate-500">
      <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-xs font-bold">송북 문서를 준비하고 있습니다...</p>
    </div>

    <div id="book-spread" class="hidden flex items-center justify-center">
      <!-- 왼쪽 페이지 -->
      <div id="left-page-box" class="page-wrapper rounded-l-md overflow-hidden">
        <canvas id="canvas-left" class="block"></canvas>
        <div id="links-left" class="link-layer"></div>
        <div id="songs-left" class="song-layer" onclick="handleLayerClick(event, 'left')"></div>
      </div>

      <!-- 오른쪽 페이지 -->
      <div id="right-page-box" class="page-wrapper rounded-r-md overflow-hidden">
        <canvas id="canvas-right" class="block"></canvas>
        <div id="links-right" class="link-layer"></div>
        <div id="songs-right" class="song-layer" onclick="handleLayerClick(event, 'right')"></div>
      </div>
    </div>

    <!-- 좌우 페이지 넘김 터치 버튼 -->
    <button onclick="prevPage()" class="fixed left-3 top-1/2 -translate-y-1/2 w-10 h-14 rounded-2xl bg-white/85 hover:bg-white text-slate-700 shadow-md border border-slate-200 flex items-center justify-center z-30 active:scale-90 transition">
      <i class="fa-solid fa-chevron-left text-sm"></i>
    </button>
    <button onclick="nextPage()" class="fixed right-3 top-1/2 -translate-y-1/2 w-10 h-14 rounded-2xl bg-white/85 hover:bg-white text-slate-700 shadow-md border border-slate-200 flex items-center justify-center z-30 active:scale-90 transition">
      <i class="fa-solid fa-chevron-right text-sm"></i>
    </button>
  </main>

  <!-- 미니 오디오 플레이어 (음원 재생 시 상단 중앙에 플로팅 표시) -->
  <div id="mini-player" class="hidden fixed top-14 left-1/2 -translate-x-1/2 z-40 bg-slate-900/90 backdrop-blur-md text-white px-4 py-2 rounded-full shadow-xl border border-white/20 flex items-center gap-3 max-w-[92vw]">
    <button onclick="toggleAudioPlayPause()" class="w-7 h-7 rounded-full bg-blue-600 hover:bg-blue-500 flex items-center justify-center text-xs shrink-0">
      <i id="mini-play-icon" class="fa-solid fa-pause"></i>
    </button>
    <div class="truncate text-xs font-bold pr-1">
      <span id="mini-track-num" class="text-blue-400 font-mono mr-1">#1</span>
      <span id="mini-track-title">SA_01_mix</span>
    </div>
    <button onclick="stopAudio()" class="text-white/60 hover:text-white text-xs px-1 shrink-0" title="정지 및 닫기">
      <i class="fa-solid fa-xmark"></i>
    </button>
  </div>

  <!-- 하단 페이지 바 -->
  <div id="bottom-nav-trigger" onclick="toggleBottomNavActive(event)">
    <div id="bottom-nav-bar" class="w-full h-full flex items-center justify-center px-4 pb-2">
      <div class="bg-slate-900/85 backdrop-blur-md border border-white/20 text-white rounded-2xl px-5 py-2 shadow-2xl flex items-center gap-4 max-w-lg w-full" onclick="event.stopPropagation()">
        <span class="font-mono text-xs font-black shrink-0 text-white/90">
          <span id="current-page-num" class="text-blue-400 text-sm">1</span> / <span id="total-page-num">1</span>
        </span>

        <input type="range" id="page-slider" min="1" max="1" value="1" oninput="onSliderInput(this.value)" class="flex-1 h-1.5 bg-white/20 rounded-lg cursor-pointer">

        <div class="flex items-center bg-white/10 rounded-lg px-2 py-0.5 border border-white/20 shrink-0">
          <input type="number" id="direct-page-input" min="1" value="1" onchange="goToPage(this.value)" class="w-10 bg-transparent text-center text-xs font-bold text-white focus:outline-none">
          <span class="text-white/40 text-xs">P</span>
        </div>
      </div>
    </div>
  </div>

  <audio id="r2-audio" preload="auto"></audio>

    let songSpotsData = JSON.parse(localStorage.getItem('dwe_song_circles')) || {};

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 1;
    let isSpreadMode = true;
    let hasCoverPage = true;
    let isRendering = false;
    let isFullscreenMode = false;
    let isSpotEditMode = false;
    let defaultCircleRadiusPct = 4.5; // 기본 원 반지름(페이지 너비 대비 %)

    let currentLeftPageNum = null;
    let currentRightPageNum = null;
    let activePlayingTrack = null;

    const audioEl = document.getElementById('r2-audio');

    async function init() {
      try {
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;

        document.getElementById('total-page-num').textContent = totalPages;
        document.getElementById('page-slider').max = totalPages;
        document.getElementById('direct-page-input').max = totalPages;

        await renderCurrentView();

        document.getElementById('loading-box').classList.add('hidden');
        document.getElementById('book-spread').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        document.getElementById('loading-box').innerHTML = `
          <p class="text-sm font-bold text-rose-600">PDF 로드 실패</p>
          <p class="text-xs text-slate-500 mt-1">${err.message}</p>
        `;
      }
    }

    async function renderCurrentView() {
      if (!pdfDoc || isRendering) return;
      isRendering = true;

      try {
        const container = document.getElementById('viewer-container');
        const padX = isFullscreenMode ? 16 : 40;
        const padY = isFullscreenMode ? 16 : 24;
        const availW = Math.max(100, container.clientWidth - padX);
        const availH = Math.max(100, container.clientHeight - padY);

        const leftBox = document.getElementById('left-page-box');
        const rightBox = document.getElementById('right-page-box');

        let leftPageNum = null;
        let rightPageNum = null;

        if (!isSpreadMode) {
          leftPageNum = currentPage;
          rightPageNum = null;
        } else {
          if (hasCoverPage) {
            if (currentPage === 1) {
              leftPageNum = null;
              rightPageNum = 1;
            } else {
              leftPageNum = (currentPage % 2 === 0) ? currentPage : currentPage - 1;
              rightPageNum = (leftPageNum + 1 <= totalPages) ? leftPageNum + 1 : null;
            }
          } else {
            leftPageNum = (currentPage % 2 !== 0) ? currentPage : currentPage - 1;
            rightPageNum = (leftPageNum + 1 <= totalPages) ? leftPageNum + 1 : null;
          }
        }

        currentLeftPageNum = leftPageNum;
        currentRightPageNum = rightPageNum;

        const refPageNum = leftPageNum || rightPageNum || 1;
        const samplePage = await pdfDoc.getPage(refPageNum);
        const baseVp = samplePage.getViewport({ scale: 1.0 });

        const isDual = isSpreadMode;
        const targetW = isDual ? (availW / 2) : availW;
        const scale = Math.min(targetW / baseVp.width, availH / baseVp.height);
        const renderedW = Math.floor(baseVp.width * scale);
        const renderedH = Math.floor(baseVp.height * scale);

        // 1. 왼쪽 슬롯
        if (leftPageNum) {
          leftBox.style.display = 'block';
          leftBox.style.visibility = 'visible';
          leftBox.className = 'page-wrapper rounded-l-md overflow-hidden book-spine-left';
          await renderSinglePage(leftPageNum, 'canvas-left', 'links-left', 'songs-left', scale);
        } else if (isSpreadMode && rightPageNum === 1) {
          leftBox.style.display = 'block';
          leftBox.style.visibility = 'hidden';
          leftBox.style.width = `${renderedW}px`;
          leftBox.style.height = `${renderedH}px`;
          document.getElementById('canvas-left').style.width = `${renderedW}px`;
          document.getElementById('canvas-left').style.height = `${renderedH}px`;
        } else {
          leftBox.style.display = 'none';
        }

        // 2. 오른쪽 슬롯
        if (rightPageNum) {
          rightBox.style.display = 'block';
          rightBox.className = (isSpreadMode && !leftPageNum)
            ? 'page-wrapper rounded-md overflow-hidden'
            : 'page-wrapper rounded-r-md overflow-hidden book-spine-right border-l border-slate-200';
          await renderSinglePage(rightPageNum, 'canvas-right', 'links-right', 'songs-right', scale);
        } else {
          rightBox.style.display = 'none';
        }

        if (!isSpreadMode) {
          leftBox.className = 'page-wrapper rounded-md overflow-hidden shadow-lg';
        }

        updateBottomNavUI();
      } finally {
        isRendering = false;
      }
    }

    async function renderSinglePage(pageNum, canvasId, linkLayerId, songLayerId, scale) {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale });

      const dpr = window.devicePixelRatio || 1;
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      const floorW = Math.floor(viewport.width);
      const floorH = Math.floor(viewport.height);

      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = `${floorW}px`;
      canvas.style.height = `${floorH}px`;

      const box = canvas.parentElement;
      box.style.width = `${floorW}px`;
      box.style.height = `${floorH}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      await page.render({ canvasContext: ctx, viewport }).promise;

      // 하이퍼링크 생성
      const linkLayer = document.getElementById(linkLayerId);
      linkLayer.innerHTML = '';
      linkLayer.style.width = `${floorW}px`;
      linkLayer.style.height = `${floorH}px`;

      const annotations = await page.getAnnotations();
      annotations.forEach(item => {
        if (item.subtype !== 'Link') return;

        const rect = pdfjsLib.Util.normalizeRect(item.rect);
        const viewRect = viewport.convertToViewportRectangle(rect);
        const x = Math.min(viewRect[0], viewRect[2]);
        const y = Math.min(viewRect[1], viewRect[3]);
        const w = Math.abs(viewRect[2] - viewRect[0]);
        const h = Math.abs(viewRect[3] - viewRect[1]);

        const a = document.createElement('a');
        a.style.left = `${x}px`;
        a.style.top = `${y}px`;
        a.style.width = `${w}px`;
        a.style.height = `${h}px`;

        if (item.url) {
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        } else if (item.dest) {
          a.href = 'javascript:void(0)';
          a.onclick = async (e) => {
            e.preventDefault();
            e.stopPropagation();
            await navigateToDestination(item.dest);
          };
        }
        linkLayer.appendChild(a);
      });

      // 원형 음원 핫스팟 그리기
      renderSongCircles(pageNum, songLayerId, floorW, floorH);
    }

    /* ==========================================
       원형 음원 핫스팟 렌더링 및 클릭 매핑
       ========================================== */
    function renderSongCircles(pageNum, layerId, pageW, pageH) {
      const layer = document.getElementById(layerId);
      layer.innerHTML = '';
      layer.style.width = `${pageW}px`;
      layer.style.height = `${pageH}px`;

      const list = songSpotsData[String(pageNum)] || [];
      list.forEach((spot, idx) => {
        const btn = document.createElement('div');
        btn.className = 'song-circle';
        if (activePlayingTrack === spot.track && !audioEl.paused) {
          btn.classList.add('playing');
        }

        const diameterPx = Math.round(pageW * (spot.r * 2 / 100));
        btn.style.left = `${spot.x}%`;
        btn.style.top = `${spot.y}%`;
        btn.style.width = `${diameterPx}px`;
        btn.style.height = `${diameterPx}px`;

        const songName = SONGS_DB[spot.track] || `Track #${spot.track}`;
        btn.title = `${spot.track}. ${songName.replace('.mp3', '')}`;

        if (isSpotEditMode) {
          btn.innerHTML = `<span class="text-[11px] font-mono font-black text-blue-900 bg-white/90 px-1.5 rounded-full shadow-xs">${spot.track}</span>`;
        }

        btn.onclick = (e) => {
          e.stopPropagation();
          if (isSpotEditMode) {
            editOrDeleteSpot(pageNum, idx);
          } else {
            playR2Song(spot.track);
          }
        };

        layer.appendChild(btn);
      });
    }

    // 편집 모드에서 빈 공간 클릭 시 새 원형 버튼 추가
    function handleLayerClick(e, side) {
      if (!isSpotEditMode) return;
      const pageNum = (side === 'left') ? currentLeftPageNum : currentRightPageNum;
      if (!pageNum) return;

      const rect = e.currentTarget.getBoundingClientRect();
      const xPct = Number((((e.clientX - rect.left) / rect.width) * 100).toFixed(2));
      const yPct = Number((((e.clientY - rect.top) / rect.height) * 100).toFixed(2));

      const input = prompt(`연결할 음원 번호를 입력하세요 (1 ~ 143):\n(예: 2 → SA_01_01 What's Your Name 1)`, '');
      if (input === null) return;

      const trackNum = parseInt(input.trim(), 10);
      if (isNaN(trackNum) || !SONGS_DB[trackNum]) {
        alert('1부터 143 사이의 유효한 음원 번호를 입력해 주세요.');
        return;
      }

      const key = String(pageNum);
      if (!songSpotsData[key]) songSpotsData[key] = [];
      songSpotsData[key].push({
        track: trackNum,
        x: xPct,
        y: yPct,
        r: defaultCircleRadiusPct
      });

      saveSpotsToLocal();
      refreshAllSongLayers();
    }

    function editOrDeleteSpot(pageNum, idx) {
      const key = String(pageNum);
      const spot = songSpotsData[key][idx];
      const currentName = SONGS_DB[spot.track] || '';
      const input = prompt(
        `현재 연결: #${spot.track} (${currentName})\n\n• 번호 변경: 새 번호(1~143) 입력\n• 삭제: 0 또는 del 입력`,
        String(spot.track)
      );

      if (input === null) return;
      const trimmed = input.trim().toLowerCase();

      if (trimmed === '0' || trimmed === 'del') {
        songSpotsData[key].splice(idx, 1);
      } else {
        const newNum = parseInt(trimmed, 10);
        if (!isNaN(newNum) && SONGS_DB[newNum]) {
          spot.track = newNum;
        } else {
          alert('올바른 음원 번호(1~143)를 입력하세요.');
          return;
        }
      }

      saveSpotsToLocal();
      refreshAllSongLayers();
    }

    function toggleSpotEditMode() {
      isSpotEditMode = !isSpotEditMode;
      const spread = document.getElementById('book-spread');
      const btn = document.getElementById('btn-edit-spots');
      const controls = document.getElementById('edit-controls');

      if (isSpotEditMode) {
        spread.classList.add('edit-active');
        btn.classList.remove('bg-slate-100', 'text-slate-700');
        btn.classList.add('bg-pink-600', 'text-white', 'border-pink-600');
        controls.classList.remove('hidden');
      } else {
        spread.classList.remove('edit-active');
        btn.classList.add('bg-slate-100', 'text-slate-700');
        btn.classList.remove('bg-pink-600', 'text-white', 'border-pink-600');
        controls.classList.add('hidden');
      }
      refreshAllSongLayers();
    }

    function changeDefaultRadius(delta) {
      defaultCircleRadiusPct = Math.max(1.5, Math.min(12.0, Number((defaultCircleRadiusPct + delta).toFixed(1))));
      document.getElementById('radius-display').textContent = `${defaultCircleRadiusPct}%`;
    }

    function saveSpotsToLocal() {
      localStorage.setItem('dwe_song_circles', JSON.stringify(songSpotsData));
    }

    function exportSpotsJSON() {
      const jsonStr = JSON.stringify(songSpotsData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'dwe_song_spots.json';
      a.click();
      URL.revokeObjectURL(url);
    }

    function refreshAllSongLayers() {
      const leftCanvas = document.getElementById('canvas-left');
      const rightCanvas = document.getElementById('canvas-right');
      if (currentLeftPageNum) {
        renderSongCircles(currentLeftPageNum, 'songs-left', parseInt(leftCanvas.style.width), parseInt(leftCanvas.style.height));
      }
      if (currentRightPageNum) {
        renderSongCircles(currentRightPageNum, 'songs-right', parseInt(rightCanvas.style.width), parseInt(rightCanvas.style.height));
      }
    }

    /* ==========================================
       R2 음원 스트리밍 재생 및 미니 플레이어
       ========================================== */
    function playR2Song(trackNum) {
      const fileName = SONGS_DB[trackNum];
      if (!fileName) return;

      // 같은 트랙을 다시 누르면 일시정지/재개 토글
      if (activePlayingTrack === trackNum && audioEl.src) {
        toggleAudioPlayPause();
        return;
      }

      activePlayingTrack = trackNum;
      const encodedName = encodeURIComponent(fileName);
      audioEl.src = `${R2_SONGS_BASE}/${encodedName}`;
      audioEl.play().catch(err => console.warn('오디오 재생 오류:', err));

      document.getElementById('mini-track-num').textContent = `#${trackNum}`;
      document.getElementById('mini-track-title').textContent = fileName.replace('.mp3', '');
      document.getElementById('mini-player').classList.remove('hidden');
      document.getElementById('mini-play-icon').className = 'fa-solid fa-pause';

      refreshAllSongLayers();
    }

    function toggleAudioPlayPause() {
      if (audioEl.paused) {
        audioEl.play();
        document.getElementById('mini-play-icon').className = 'fa-solid fa-pause';
      } else {
        audioEl.pause();
        document.getElementById('mini-play-icon').className = 'fa-solid fa-play';
      }
      refreshAllSongLayers();
    }

    function stopAudio() {
      audioEl.pause();
      audioEl.currentTime = 0;
      activePlayingTrack = null;
      document.getElementById('mini-player').classList.add('hidden');
      refreshAllSongLayers();
    }

    audioEl.addEventListener('ended', () => {
      document.getElementById('mini-play-icon').className = 'fa-solid fa-play';
      refreshAllSongLayers();
    });

    /* ==========================================
       페이지 네비게이션 & 전체화면
       ========================================== */
    async function navigateToDestination(dest) {
      try {
        let destArray = dest;
        if (typeof dest === 'string') {
          destArray = await pdfDoc.getDestination(dest);
        }
        if (Array.isArray(destArray) && destArray[0]) {
          const ref = destArray[0];
          const pageIndex = (typeof ref === 'object') ? await pdfDoc.getPageIndex(ref) : ref;
          currentPage = pageIndex + 1;
          await renderCurrentView();
        }
      } catch (err) {
        console.warn('목차 이동 실패:', err);
      }
    }

    function prevPage() {
      if (currentPage <= 1) return;
      if (!isSpreadMode) {
        currentPage--;
      } else {
        if (hasCoverPage) {
          currentPage = (currentPage <= 3) ? 1 : currentPage - 2;
        } else {
          currentPage = (currentPage <= 2) ? 1 : currentPage - 2;
        }
      }
      renderCurrentView();
    }

    function nextPage() {
      if (currentPage >= totalPages) return;
      if (!isSpreadMode) {
        currentPage++;
      } else {
        if (hasCoverPage) {
          currentPage = (currentPage === 1) ? 2 : Math.min(totalPages, currentPage + 2);
        } else {
          currentPage = Math.min(totalPages, currentPage + 2);
        }
      }
      renderCurrentView();
    }

    function goToPage(val) {
      const num = parseInt(val, 10);
      if (!isNaN(num) && num >= 1 && num <= totalPages) {
        currentPage = num;
        renderCurrentView();
      }
    }

    function toggleSpreadMode() {
      isSpreadMode = !isSpreadMode;
      document.getElementById('label-spread').textContent = isSpreadMode ? '2쪽보기' : '1쪽보기';
      renderCurrentView();
    }

    function toggleCoverMode() {
      hasCoverPage = !hasCoverPage;
      document.getElementById('label-cover').textContent = hasCoverPage ? '표지포함' : '표지미포함';
      renderCurrentView();
    }

    function toggleFullscreen(forceState) {
      const targetState = (typeof forceState === 'boolean') ? forceState : !isFullscreenMode;
      if (targetState) {
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => applyFullscreenUI(true));
        } else {
          applyFullscreenUI(true);
        }
      } else {
        if (document.fullscreenElement && document.exitFullscreen) {
          document.exitFullscreen().catch(() => applyFullscreenUI(false));
        } else {
          applyFullscreenUI(false);
        }
      }
    }

    function applyFullscreenUI(isFs) {
      isFullscreenMode = isFs;
      const topPanel = document.getElementById('top-panel');
      const topHotspot = document.getElementById('top-exit-hotspot');
      const floatExit = document.getElementById('btn-floating-exit');
      const fsIcon = document.getElementById('fs-icon');

      if (isFs) {
        topPanel.classList.add('hidden');
        topHotspot.classList.remove('hidden');
        floatExit.classList.remove('hidden');
        if (fsIcon) fsIcon.className = "fa-solid fa-compress";
      } else {
        topPanel.classList.remove('hidden');
        topHotspot.classList.add('hidden');
        floatExit.classList.add('hidden');
        if (fsIcon) fsIcon.className = "fa-solid fa-expand";
      }
      setTimeout(renderCurrentView, 120);
    }

    document.addEventListener('fullscreenchange', () => {
      applyFullscreenUI(!!document.fullscreenElement);
    });

    function updateBottomNavUI() {
      document.getElementById('current-page-num').textContent = currentPage;
      document.getElementById('page-slider').value = currentPage;
      document.getElementById('direct-page-input').value = currentPage;
    }

    let sliderDebounce;
    function onSliderInput(val) {
      document.getElementById('current-page-num').textContent = val;
      document.getElementById('direct-page-input').value = val;
      clearTimeout(sliderDebounce);
      sliderDebounce = setTimeout(() => {
        goToPage(val);
      }, 70);
    }

    let hideBottomTimer;
    function toggleBottomNavActive() {
      const bar = document.getElementById('bottom-nav-bar');
      bar.classList.add('active');
      clearTimeout(hideBottomTimer);
      hideBottomTimer = setTimeout(() => {
        bar.classList.remove('active');
      }, 3500);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'Escape' && isFullscreenMode) toggleFullscreen(false);
    });

    let touchStartX = 0;
    window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    window.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 60) {
        if (diff < 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderCurrentView, 150);
    });

    window.onload = init;
  </script>
</body>
