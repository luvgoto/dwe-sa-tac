<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DWE Smart Songbook Viewer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PDF.js 3.11.174 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f1f5f9;
      overflow: hidden;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      perspective: 1600px; /* 원근감 */
    }

    /* 책 컨테이너 및 부드러운 페이지 전환 */
    #book-spread {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.28s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.22s ease;
      transform-style: preserve-3d;
    }
    
    .anim-flip-next {
      animation: flipNext 0.32s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .anim-flip-prev {
      animation: flipPrev 0.32s cubic-bezier(0.25, 1, 0.5, 1);
    }

    @keyframes flipNext {
      0% { transform: scale(0.98) rotateY(-8deg); opacity: 0.85; }
      100% { transform: scale(1) rotateY(0deg); opacity: 1; }
    }
    @keyframes flipPrev {
      0% { transform: scale(0.98) rotateY(8deg); opacity: 0.85; }
      100% { transform: scale(1) rotateY(0deg); opacity: 1; }
    }

    /* 개별 페이지 래퍼 및 양장본 그림자 효과 */
    .page-wrapper {
      position: relative;
      background: white;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
      backface-visibility: hidden;
    }
    
    /* 실제 책 제본선(중앙 홈) 그림자 */
    .book-spine-left {
      box-shadow: inset -10px 0 16px -8px rgba(0, 0, 0, 0.15), 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }
    .book-spine-right {
      box-shadow: inset 10px 0 16px -8px rgba(0, 0, 0, 0.15), 0 10px 25px -5px rgba(0, 0, 0, 0.1);
    }

    /* 하이퍼링크 레이어 */
    .link-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 20;
      pointer-events: none;
    }
    .link-layer a {
      position: absolute;
      display: block;
      pointer-events: auto;
      cursor: pointer;
      border-radius: 3px;
      transition: background-color 0.15s;
    }
    .link-layer a:hover {
      background-color: rgba(59, 130, 246, 0.18);
      outline: 1.5px solid rgba(59, 130, 246, 0.5);
    }
  </style>
</head>
<body class="h-screen w-screen flex flex-col">

  <!-- 상단 컨트롤 헤더 -->
  <header class="h-12 bg-white border-b border-slate-200 px-3 sm:px-5 flex items-center justify-between shrink-0 z-30 shadow-xs">
    <div class="flex items-center gap-2">
      <span class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center text-xs shadow-xs">
        <i class="fa-solid fa-book-open"></i>
      </span>
      <span class="font-black text-slate-800 text-xs sm:text-sm tracking-tight">SMART BOOK VIEWER</span>
    </div>

    <!-- 옵션 토글 버튼들 -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- 표지 포함 여부 토글 -->
      <button id="btn-cover-toggle" onclick="toggleCoverMode()" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold hover:bg-slate-200 transition">
        <i class="fa-solid fa-bookmark mr-1 text-blue-600"></i><span id="cover-label">표지 포함 (우측시작)</span>
      </button>

      <!-- 1쪽/2쪽 모아보기 토글 -->
      <button id="btn-spread-toggle" onclick="toggleSpreadMode()" class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold hover:bg-blue-100 transition">
        <i class="fa-solid fa-columns mr-1"></i><span id="spread-label">2쪽 보기</span>
      </button>

      <!-- 페이지 번호 -->
      <div class="flex items-center bg-slate-100 rounded-lg px-2 py-1 border border-slate-200 text-xs font-mono font-bold ml-1">
        <input type="number" id="page-input" min="1" value="1" onchange="goToPage(this.value)" class="w-10 bg-transparent text-center text-slate-800 focus:outline-none">
        <span class="text-slate-400 mx-0.5">/</span>
        <span id="total-pages" class="text-slate-600">-</span>
      </div>
    </div>
  </header>

  <!-- 메인 뷰어 영역 -->
  <main id="viewer-container" class="flex-1 w-full h-full relative flex items-center justify-center p-2 sm:p-4 overflow-hidden">
    
    <!-- 로딩 스피너 -->
    <div id="loading-box" class="flex flex-col items-center justify-center text-slate-500">
      <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-xs font-bold">송북 문서를 준비하고 있습니다...</p>
    </div>

    <!-- 양면 책 펼침 컨테이너 -->
    <div id="book-spread" class="hidden flex items-center justify-center">
      <!-- 왼쪽 페이지 (1페이지 단독일 땐 자리만 차지하거나 투명) -->
      <div id="left-page-box" class="page-wrapper rounded-l-md overflow-hidden">
        <canvas id="canvas-left" class="block"></canvas>
        <div id="links-left" class="link-layer"></div>
      </div>

      <!-- 오른쪽 페이지 -->
      <div id="right-page-box" class="page-wrapper rounded-r-md overflow-hidden">
        <canvas id="canvas-right" class="block"></canvas>
        <div id="links-right" class="link-layer"></div>
      </div>
    </div>

    <!-- 좌우 페이지 넘김 터치 버튼 -->
    <button onclick="prevPage()" class="fixed left-3 top-1/2 -translate-y-1/2 w-10 h-14 rounded-2xl bg-white/85 hover:bg-white text-slate-700 shadow-md border border-slate-200 flex items-center justify-center z-30 active:scale-90 transition">
      <i class="fa-solid fa-chevron-left text-sm"></i>
    </button>
    <button onclick="nextPage()" class="fixed right-3 top-1/2 -translate-y-1/2 w-10 h-14 rounded-2xl bg-white/85 hover:bg-white text-slate-700 shadow-md border border-slate-200 flex items-center justify-center z-30 active:scale-90 transition">
      <i class="fa-solid fa-chevron-right text-sm"></i>
    </button>

  </main>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    const PDF_URL = 'https://raw.githubusercontent.com/luvgoto/dwe-sa-tac/main/songbook.pdf';

    let pdfDoc = null;
    let currentPage = 1;
    let totalPages = 1;
    let isSpreadMode = true;       // true: 2쪽 보기, false: 1쪽 보기
    let hasCoverPage = true;       // true: 1p 표지 우측 시작, false: 1p부터 좌우 나란히
    let isRendering = false;

    async function init() {
      try {
        const loadingTask = pdfjsLib.getDocument(PDF_URL);
        pdfDoc = await loadingTask.promise;
        totalPages = pdfDoc.numPages;

        document.getElementById('total-pages').textContent = totalPages;
        document.getElementById('page-input').max = totalPages;

        await renderCurrentView();

        document.getElementById('loading-box').classList.add('hidden');
        document.getElementById('book-spread').classList.remove('hidden');
      } catch (err) {
        console.error(err);
        document.getElementById('loading-box').innerHTML = `
          <p class="text-sm font-bold text-rose-600">PDF 로드 실패</p>
          <p class="text-xs text-slate-500 mt-1">${err.message}</p>
        `;
      }
    }

    // 화면 렌더링 및 페이지 배치 계산
    async function renderCurrentView(animDirection = null) {
      if (!pdfDoc || isRendering) return;
      isRendering = true;

      const spreadEl = document.getElementById('book-spread');
      if (animDirection) {
        spreadEl.classList.remove('anim-flip-next', 'anim-flip-prev');
        void spreadEl.offsetWidth; // DOM 리플로우 유도
        spreadEl.classList.add(animDirection === 'next' ? 'anim-flip-next' : 'anim-flip-prev');
      }

      try {
        const container = document.getElementById('viewer-container');
        const availW = container.clientWidth - 48;
        const availH = container.clientHeight - 24;

        const leftBox = document.getElementById('left-page-box');
        const rightBox = document.getElementById('right-page-box');

        let leftPageNum = null;
        let rightPageNum = null;

        if (!isSpreadMode) {
          // [1쪽 보기 모드]
          leftPageNum = currentPage;
          rightPageNum = null;
        } else {
          // [2쪽 모아보기 모드]
          if (hasCoverPage) {
            // 표지 포함 모드: 1페이지는 책 겉표지로서 우측에 단독 표시
            if (currentPage === 1) {
              leftPageNum = null;
              rightPageNum = 1;
            } else {
              // 2페이지부터는 짝수가 왼쪽, 홀수가 오른쪽 (2-3, 4-5...)
              leftPageNum = (currentPage % 2 === 0) ? currentPage : currentPage - 1;
              rightPageNum = (leftPageNum + 1 <= totalPages) ? leftPageNum + 1 : null;
            }
          } else {
            // 표지 미포함 모드: 1페이지부터 일반 양면 (1-2, 3-4, 5-6...)
            leftPageNum = (currentPage % 2 !== 0) ? currentPage : currentPage - 1;
            rightPageNum = (leftPageNum + 1 <= totalPages) ? leftPageNum + 1 : null;
          }
        }

        // 기준 비율 계산
        const refPageNum = leftPageNum || rightPageNum || 1;
        const samplePage = await pdfDoc.getPage(refPageNum);
        const baseVp = samplePage.getViewport({ scale: 1.0 });

        // 양면일 때는 2개 분량의 가로폭 대비 축소율 계산
        const isDualLayout = isSpreadMode;
        const targetW = isDualLayout ? (availW / 2) : availW;
        const scale = Math.min(targetW / baseVp.width, availH / baseVp.height);

        // 1. 왼쪽 슬롯 처리
        if (leftPageNum) {
          leftBox.style.visibility = 'visible';
          leftBox.className = 'page-wrapper rounded-l-md overflow-hidden book-spine-left';
          await renderSinglePage(leftPageNum, 'canvas-left', 'links-left', scale);
        } else if (isSpreadMode && rightPageNum === 1) {
          // 1페이지가 우측에 배치될 때 왼쪽 공간을 투명하게 비워 균형 유지
          leftBox.style.visibility = 'hidden';
          leftBox.style.width = `${Math.floor(baseVp.width * scale)}px`;
          leftBox.style.height = `${Math.floor(baseVp.height * scale)}px`;
        } else {
          leftBox.style.visibility = 'visible';
        }

        // 2. 오른쪽 슬롯 처리
        if (rightPageNum) {
          rightBox.classList.remove('hidden');
          rightBox.className = (isSpreadMode && !leftPageNum)
            ? 'page-wrapper rounded-md overflow-hidden' // 표지 단독일 땐 양쪽 모서리 둥글게
            : 'page-wrapper rounded-r-md overflow-hidden book-spine-right border-l border-slate-200';
          await renderSinglePage(rightPageNum, 'canvas-right', 'links-right', scale);
        } else {
          rightBox.classList.add('hidden');
        }

        // 1쪽 모드일 때 왼쪽 박스 테두리 정돈
        if (!isSpreadMode) {
          leftBox.className = 'page-wrapper rounded-md overflow-hidden shadow-lg';
        }

        document.getElementById('page-input').value = currentPage;
      } finally {
        isRendering = false;
      }
    }

    // 캔버스 + 하이퍼링크 렌더링
    async function renderSinglePage(pageNum, canvasId, linkLayerId, scale) {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale });

      const dpr = window.devicePixelRatio || 1;
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = `${Math.floor(viewport.width)}px`;
      canvas.style.height = `${Math.floor(viewport.height)}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      await page.render({ canvasContext: ctx, viewport }).promise;

      // 하이퍼링크 레이어
      const linkLayer = document.getElementById(linkLayerId);
      linkLayer.innerHTML = '';
      linkLayer.style.width = `${Math.floor(viewport.width)}px`;
      linkLayer.style.height = `${Math.floor(viewport.height)}px`;

      const annotations = await page.getAnnotations();
      annotations.forEach(item => {
        if (item.subtype !== 'Link') return;

        const rect = pdfjsLib.Util.normalizeRect(item.rect);
        const viewRect = viewport.convertToViewportRectangle(rect);
        const x = Math.min(viewRect[0], viewRect[2]);
        const y = Math.min(viewRect[1], viewRect[3]);
        const w = Math.abs(viewRect[2] - viewRect[0]);
        const h = Math.abs(viewRect[3] - viewRect[1]);

        const a = document.createElement('a');
        a.style.left = `${x}px`;
        a.style.top = `${y}px`;
        a.style.width = `${w}px`;
        a.style.height = `${h}px`;

        if (item.url) {
          a.href = item.url;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        } else if (item.dest) {
          a.href = '#';
          a.onclick = async (e) => {
            e.preventDefault();
            e.stopPropagation();
            await navigateToDestination(item.dest);
          };
        }
        linkLayer.appendChild(a);
      });
    }

    async function navigateToDestination(dest) {
      try {
        let destArray = dest;
        if (typeof dest === 'string') {
          destArray = await pdfDoc.getDestination(dest);
        }
        if (Array.isArray(destArray) && destArray[0]) {
          const ref = destArray[0];
          const pageIndex = (typeof ref === 'object') ? await pdfDoc.getPageIndex(ref) : ref;
          currentPage = pageIndex + 1;
          await renderCurrentView('next');
        }
      } catch (err) {
        console.warn('목차 이동 실패:', err);
      }
    }

    function prevPage() {
      if (currentPage <= 1) return;
      if (!isSpreadMode) {
        currentPage--;
      } else {
        if (hasCoverPage) {
          currentPage = (currentPage <= 3) ? 1 : currentPage - 2;
        } else {
          currentPage = (currentPage <= 2) ? 1 : currentPage - 2;
        }
      }
      renderCurrentView('prev');
    }

    function nextPage() {
      if (currentPage >= totalPages) return;
      if (!isSpreadMode) {
        currentPage++;
      } else {
        if (hasCoverPage) {
          currentPage = (currentPage === 1) ? 2 : Math.min(totalPages, currentPage + 2);
        } else {
          currentPage = Math.min(totalPages, currentPage + 2);
        }
      }
      renderCurrentView('next');
    }

    function goToPage(val) {
      const num = parseInt(val, 10);
      if (!isNaN(num) && num >= 1 && num <= totalPages) {
        currentPage = num;
        renderCurrentView();
      }
    }

    function toggleCoverMode() {
      hasCoverPage = !hasCoverPage;
      document.getElementById('cover-label').textContent = hasCoverPage ? '표지 포함 (우측시작)' : '표지 미포함 (1p좌측)';
      renderCurrentView();
    }

    function toggleSpreadMode() {
      isSpreadMode = !isSpreadMode;
      document.getElementById('spread-label').textContent = isSpreadMode ? '2쪽 보기' : '1쪽 보기';
      renderCurrentView();
    }

    // 키보드 좌우 방향키
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'ArrowRight') nextPage();
    });

    // 태블릿 터치 스와이프 지원
    let touchStartX = 0;
    window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    window.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 60) {
        if (diff < 0) nextPage();
        else prevPage();
      }
    }, { passive: true });

    let resizeTimer;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(renderCurrentView, 150);
    });

    window.onload = init;
  </script>
</body>
</html>
