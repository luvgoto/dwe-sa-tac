<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DWE VIEWER</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="songs-data.js"></script>
  <style>
    body {
      margin: 0; padding: 0; background-color: #f1f5f9;
      overflow: hidden; user-select: none;
      -webkit-tap-highlight-color: transparent !important;
    }
    .page-wrapper {
      position: relative; background: white; flex-shrink: 0;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
    }
    .book-spine-left { box-shadow: inset -8px 0 14px -6px rgba(0, 0, 0, 0.15), 0 10px 25px -5px rgba(0, 0, 0, 0.1); }
    .book-spine-right { box-shadow: inset 8px 0 14px -6px rgba(0, 0, 0, 0.15), 0 10px 25px -5px rgba(0, 0, 0, 0.1); }

    /* PDF 내부 하이퍼링크 */
    .link-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 25; pointer-events: none; }
    .link-layer a {
      position: absolute; display: block; pointer-events: auto; cursor: pointer;
      background: transparent !important; outline: none !important;
      -webkit-tap-highlight-color: transparent !important; -webkit-touch-callout: none !important;
    }
    /* 목차 페이지에서 '음원 ON' 상태이거나 편집 모드일 때만 하이퍼링크 비활성화 */
    .toc-audio-on .link-layer a,
    .edit-active .link-layer a {
      pointer-events: none !important;
    }

    /* 원형/사각형 음원 핫스팟 레이어 */
    .song-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 30; pointer-events: none; }
    .edit-active .song-layer { pointer-events: auto; cursor: crosshair; }

    /* 마우스를 따라다니는 가상 가이드 */
    .ghost-guide {
      position: absolute; transform: translate(-50%, -50%);
      border: 2.5px dashed #ec4899;
      background-color: rgba(236, 72, 153, 0.18);
      pointer-events: none; z-index: 35; display: none;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.85);
    }
    .ghost-guide.shape-circle { border-radius: 9999px; }
    .ghost-guide.shape-rect { border-radius: 10px; }

    /* 배치된 핫스팟 버튼 */
    .song-spot {
      position: absolute; transform: translate(-50%, -50%);
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.15s ease, background-color 0.15s ease;
    }
    .song-spot.shape-circle { border-radius: 9999px; }
    .song-spot.shape-rect { border-radius: 10px; }

    /* 지정된 목차 페이지에서 '음원 OFF' 상태일 때만 음원 버튼 터치 투과 (하이퍼링크 우선) */
    .toc-audio-off .song-spot {
      pointer-events: none;
    }

    .song-spot:active { transform: translate(-50%, -50%) scale(0.94); background-color: rgba(37, 99, 235, 0.2); }
    .song-spot.playing {
      background-color: rgba(37, 99, 235, 0.16);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.45);
      animation: pulseRing 1.8s infinite;
    }
    .song-spot.playing-voca {
      background-color: rgba(16, 185, 129, 0.16);
      box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.55);
      animation: pulseVoca 1.5s infinite;
    }
    @keyframes pulseRing {
      0%, 100% { box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.5); }
      50% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0.15); }
    }
    @keyframes pulseVoca {
      0%, 100% { box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.6); }
      50% { box-shadow: 0 0 0 6px rgba(16, 185, 129, 0.15); }
    }
    .edit-active .song-spot {
      background-color: rgba(37, 99, 235, 0.28);
      border: 2px solid #1d4ed8;
      pointer-events: auto !important;
      cursor: pointer;
    }

    #bottom-nav-trigger { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; z-index: 40; }
    #bottom-nav-bar { transition: transform 0.25s ease, opacity 0.25s ease; transform: translateY(100%); opacity: 0; pointer-events: none; }
    #bottom-nav-trigger:hover #bottom-nav-bar, #bottom-nav-bar.active { transform: translateY(0); opacity: 1; pointer-events: auto; }
    input[type=range] { accent-color: #2563eb; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-slate-100">

  <!-- 상단 패널 -->
  <header id="top-panel" class="h-12 bg-white border-b border-slate-200 px-3 sm:px-4 flex items-center justify-between shrink-0 z-30">
    <div class="flex items-center gap-2">
      <span class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center text-xs shadow-xs">
        <i class="fa-solid fa-book-open"></i>
      </span>
      <span class="font-black text-slate-800 text-sm tracking-tight">DWE VIEWER</span>
    </div>

    <div class="flex items-center gap-1.5 sm:gap-2">
      <!-- 지정 목차 페이지(4-6, 74-76, 142-143, 216-217) 전용 음원 ON/OFF 토글 -->
      <button id="btn-toc-mode-toggle" onclick="toggleTocInteractionMode()" class="hidden px-2.5 py-1 rounded-lg bg-slate-200 text-slate-700 border border-slate-300 text-xs font-bold shadow-xs transition">
        <i class="fa-solid fa-volume-xmark mr-1"></i><span>음원 OFF</span>
      </button>

      <!-- 편집 모드 전용 도구 -->
      <div id="edit-controls" class="hidden flex items-center gap-1.5 bg-pink-50 border border-pink-200 rounded-lg px-2 py-0.5 mr-1">
        <div class="flex items-center bg-white rounded border border-pink-200 p-0.5 text-[10px] font-bold">
          <button id="btn-shape-circle" onclick="setBrushShape('circle')" class="px-2 py-0.5 rounded bg-pink-600 text-white">원형</button>
          <button id="btn-shape-rect" onclick="setBrushShape('rect')" class="px-2 py-0.5 rounded text-slate-600 hover:bg-pink-50">사각</button>
        </div>

        <div id="circle-size-box" class="flex items-center gap-1">
          <span class="text-[11px] font-bold text-pink-800">크기</span>
          <input type="number" id="circle-size-input" step="0.5" min="1" max="60" value="12"
                 onchange="updateCircleSize(this.value)"
                 oninput="updateCircleSize(this.value)"
                 class="w-12 px-1 py-0.5 text-center text-[11px] font-mono font-bold bg-white border border-pink-300 rounded text-pink-900 focus:outline-none focus:border-pink-500">
        </div>

        <div id="rect-size-box" class="hidden flex items-center gap-1">
          <span class="text-[11px] font-bold text-pink-800">가로</span>
          <input type="number" id="rect-w-input" step="0.5" min="1" max="85" value="26"
                 onchange="updateRectW(this.value)"
                 oninput="updateRectW(this.value)"
                 class="w-12 px-1 py-0.5 text-center text-[11px] font-mono font-bold bg-white border border-pink-300 rounded text-pink-900 focus:outline-none focus:border-pink-500">
          <span class="text-[11px] font-bold text-pink-800 ml-0.5">세로</span>
          <input type="number" id="rect-h-input" step="0.5" min="1" max="85" value="12"
                 onchange="updateRectH(this.value)"
                 oninput="updateRectH(this.value)"
                 class="w-12 px-1 py-0.5 text-center text-[11px] font-mono font-bold bg-white border border-pink-300 rounded text-pink-900 focus:outline-none focus:border-pink-500">
          <button type="button" onclick="applyRectPreset(26, 12)" title="큰네모 (26 / 12)" class="ml-0.5 px-1.5 py-0.5 rounded bg-white hover:bg-pink-100 border border-pink-300 text-[10px] font-bold text-pink-800">대</button>
          <button type="button" onclick="applyRectPreset(19.5, 9)" title="작은네모 (19.5 / 9)" class="px-1.5 py-0.5 rounded bg-white hover:bg-pink-100 border border-pink-300 text-[10px] font-bold text-pink-800">소</button>
        </div>

        <span id="sync-status-badge" class="ml-1 px-2 py-0.5 rounded bg-emerald-100 text-emerald-800 font-bold text-[10px] flex items-center gap-1">
          <i class="fa-solid fa-cloud-check"></i><span>자동저장 대기</span>
        </span>
      </div>

      <button id="btn-edit-spots" onclick="toggleSpotEditMode()" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold hover:bg-slate-200 transition">
        <i class="fa-solid fa-music mr-1 text-pink-600"></i><span>음원편집</span>
      </button>

      <button onclick="toggleSpreadMode()" class="px-2.5 py-1 rounded-lg bg-blue-50 text-blue-700 border border-blue-200 text-xs font-bold hover:bg-blue-100 transition">
        <i class="fa-solid fa-columns mr-1"></i><span id="label-spread">2쪽보기</span>
      </button>

      <button onclick="toggleCoverMode()" class="px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold hover:bg-slate-200 transition">
        <i class="fa-solid fa-bookmark mr-1 text-blue-600"></i><span id="label-cover">표지포함</span>
      </button>

      <button onclick="toggleFullscreen()" title="전체화면" class="w-8 h-8 rounded-lg bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 flex items-center justify-center text-xs font-bold transition">
        <i id="fs-icon" class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- 전체화면 복귀 핫스팟 & 플로팅 버튼 -->
  <div id="top-exit-hotspot" onclick="toggleFullscreen(false)" class="hidden fixed top-0 left-0 right-0 h-6 z-50 cursor-pointer"></div>
  <button id="btn-floating-exit" onclick="toggleFullscreen(false)" class="hidden fixed top-3 right-3 z-50 px-3 py-1.5 rounded-full bg-black/60 hover:bg-black/80 text-white text-xs font-bold backdrop-blur-md shadow-lg border border-white/20 transition">
    <i class="fa-solid fa-compress mr-1"></i> 복귀
  </button>

  <!-- 메인 뷰어 -->
  <main id="viewer-container" class="flex-1 w-full h-full relative flex items-center justify-center p-2 sm:p-4 overflow-hidden">
    <div id="loading-box" class="flex flex-col items-center justify-center text-slate-500">
      <div class="w-10 h-10 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mb-3"></div>
      <p class="text-xs font-bold">송북 문서 및 클라우드 데이터를 불러오고 있습니다...</p>
    </div>

    <!-- 책 바로 양옆에 밀착된 좌/우 페이지 넘김 버튼 + 펼쳐진 책 -->
    <div id="book-spread" class="hidden flex items-center justify-center">
      <!-- 왼쪽 페이지 바로 옆 이전 버튼 -->
      <button onclick="prevPage()" title="이전 페이지" class="mr-1.5 sm:mr-2.5 w-8 sm:w-9 h-14 rounded-xl bg-white/90 hover:bg-white text-slate-700 shadow-md border border-slate-200 flex items-center justify-center shrink-0 z-30 active:scale-90 transition">
        <i class="fa-solid fa-chevron-left text-xs sm:text-sm"></i>
      </button>

      <!-- 왼쪽 페이지 -->
      <div id="left-page-box" class="page-wrapper rounded-l-md overflow-hidden">
        <canvas id="canvas-left" class="block"></canvas>
        <div id="links-left" class="link-layer"></div>
        <div id="songs-left" class="song-layer"
             onmousemove="moveGhost(event, 'left')"
             onmouseleave="hideGhost('left')"
             onclick="openSpotModalNew(event, 'left')"></div>
        <div id="ghost-left" class="ghost-guide shape-circle"></div>
      </div>

      <!-- 오른쪽 페이지 -->
      <div id="right-page-box" class="page-wrapper rounded-r-md overflow-hidden">
        <canvas id="canvas-right" class="block"></canvas>
        <div id="links-right" class="link-layer"></div>
        <div id="songs-right" class="song-layer"
             onmousemove="moveGhost(event, 'right')"
             onmouseleave="hideGhost('right')"
             onclick="openSpotModalNew(event, 'right')"></div>
        <div id="ghost-right" class="ghost-guide shape-circle"></div>
      </div>

      <!-- 오른쪽 페이지 바로 옆 다음 버튼 -->
      <button onclick="nextPage()" title="다음 페이지" class="ml-1.5 sm:ml-2.5 w-8 sm:w-9 h-14 rounded-xl bg-white/90 hover:bg-white text-slate-700 shadow-md border border-slate-200 flex items-center justify-center shrink-0 z-30 active:scale-90 transition">
        <i class="fa-solid fa-chevron-right text-xs sm:text-sm"></i>
      </button>
    </div>
  </main>

  <!-- 음원 검색 및 선택/삭제 모달 -->
  <div id="song-modal" class="hidden fixed inset-0 z-50 bg-black/40 backdrop-blur-xs flex items-center justify-center p-4" onclick="closeSongModal()">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-sm overflow-hidden" onclick="event.stopPropagation()">
      <div class="px-4 py-3 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span id="modal-title" class="text-xs font-black text-slate-800">음원 연결</span>
          <span id="ocr-status-tag" class="hidden px-1.5 py-0.5 rounded bg-amber-100 text-amber-800 text-[10px] font-bold">번호 읽는 중...</span>
        </div>
        <button onclick="closeSongModal()" class="text-slate-400 hover:text-slate-600 text-sm"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="p-3">
        <div class="flex items-center gap-2 mb-2">
          <input type="text" id="song-search-input" placeholder="노래(1~143) 또는 단어(v001~v510) 검색..."
                 oninput="filterSongList(this.value)"
                 onkeyup="filterSongList(this.value)"
                 onkeydown="if(event.key==='Enter') selectFirstFilteredSong()"
                 class="flex-1 px-3 py-2 text-xs font-bold border border-slate-300 rounded-xl focus:outline-none focus:border-blue-500">
          <canvas id="ocr-preview-canvas" width="44" height="44" title="인식한 우측 상단 파란 원" class="hidden rounded-lg border border-slate-300 bg-slate-100 shrink-0"></canvas>
        </div>
        <div id="song-search-results" class="max-h-56 overflow-y-auto divide-y divide-slate-100 border border-slate-100 rounded-xl"></div>
      </div>
      <div id="modal-footer-delete" class="hidden px-4 py-2.5 bg-rose-50 border-t border-rose-100 flex justify-between items-center">
        <span class="text-[11px] text-rose-700 font-bold">이 음원 영역을 제거할까요?</span>
        <button onclick="deleteCurrentSpot()" class="px-3 py-1 rounded-lg bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold">삭제</button>
      </div>
    </div>
  </div>

  <!-- 하단 페이지 네비게이터 -->
  <div id="bottom-nav-trigger" onclick="toggleBottomNavActive()">
    <div id="bottom-nav-bar" class="w-full h-full flex items-center justify-center px-4 pb-2">
      <div class="bg-slate-900/85 backdrop-blur-md border border-white/20 text-white rounded-2xl px-5 py-2 shadow-2xl flex items-center gap-4 max-w-lg w-full" onclick="event.stopPropagation()">
        <span class="font-mono text-xs font-black shrink-0 text-white/90">
          <span id="current-page-num" class="text-blue-400 text-sm">1</span> / <span id="total-page-num">1</span>
        </span>
        <input type="range" id="page-slider" min="1" max="1" value="1" oninput="onSliderInput(this.value)" class="flex-1 h-1.5 bg-white/20 rounded-lg cursor-pointer">
        <div class="flex items-center bg-white/10 rounded-lg px-2 py-0.5 border border-white/20 shrink-0">
          <input type="number" id="direct-page-input" min="1" value="1" onchange="goToPage(this.value)" class="w-10 bg-transparent text-center text-xs font-bold text-white focus:outline-none">
          <span class="text-white/40 text-xs">P</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 2채널 오디오: 노래 전용 채널 + 보카(단어) 전용 채널 -->
  <audio id="song-audio" crossorigin="anonymous" preload="auto"></audio>
  <audio id="voca-audio" crossorigin="anonymous" preload="auto"></audio>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const PDF_URL = 'https://raw.githubusercontent.com/luvgoto/dwe-sa-tac/main/songbook.pdf';

    // 음원 ON/OFF 토글을 표시할 목차 전용 페이지 목록
    const TOC_PAGES = new Set([4, 5, 6, 74, 75, 76, 142, 143, 216, 217]);

    const WORKER_ROOT = (typeof R2_SONGS_BASE !== 'undefined')
      ? R2_SONGS_BASE.replace(/\/songs\/?$/, '')
      : '';
    const SPOTS_SYNC_URL = WORKER_ROOT ? `${WORKER_ROOT}/spots-data.json` : '';

    let songSpotsData = (typeof DEFAULT_SONG_SPOTS !== 'undefined' ? JSON.parse(JSON.stringify(DEFAULT_SONG_SPOTS)) : {});

    let pdfDoc = null, currentPage = 1, totalPages = 1;
    let isSpreadMode = true, hasCoverPage = true, isRendering = false;
    let isFullscreenMode = false, isSpotEditMode = false;
    let tocAudioMode = false;

    let currentShape = 'circle';
    let circleSize = 12.0;
    let rectW = 26.0;
    let rectH = 12.0;

    let currentLeftPageNum = null, currentRightPageNum = null;
    // 노래 재생 중인 개별 카드 키와 보카 재생 중인 개별 카드 키를 독립 관리
    let activeSongSpotKey = null;
    let activeVocaSpotKey = null;
    let pendingSpotContext = null;
    let ocrWorker = null;

    const preloadedAudioUrls = new Set();
    const songAudioEl = document.getElementById('song-audio');
    const vocaAudioEl = document.getElementById('voca-audio');

    /* ==========================================
       Web Audio API 기반 노래 볼륨 페이드 덕킹 (iOS/Android/PC 완벽 호환)
       ========================================== */
    let audioCtx = null;
    let songGainNode = null;
    let isSongDucking = false;

    function initSongGainDucking() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (!AudioContextClass) return;
          audioCtx = new AudioContextClass();
          const source = audioCtx.createMediaElementSource(songAudioEl);
          songGainNode = audioCtx.createGain();
          songGainNode.gain.value = 1.0;
          source.connect(songGainNode);
          songGainNode.connect(audioCtx.destination);
        }
        if (audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('Web Audio Gain 초기화 폴백:', e);
      }
    }

    function fadeSongVolume(targetLevel, durationSec) {
      initSongGainDucking();
      if (songGainNode && audioCtx) {
        const now = audioCtx.currentTime;
        songGainNode.gain.cancelScheduledValues(now);
        songGainNode.gain.setValueAtTime(songGainNode.gain.value, now);
        songGainNode.gain.linearRampToValueAtTime(targetLevel, now + durationSec);
      } else {
        songAudioEl.volume = targetLevel;
      }
    }

    function duckSongForVoca() {
      if (!songAudioEl.paused && !isSongDucking) {
        isSongDucking = true;
        fadeSongVolume(0.15, 0.25); // 0.25초 동안 15% 볼륨으로 부드럽게 페이드 아웃
      }
    }

    function restoreSongAfterVoca() {
      if (isSongDucking) {
        isSongDucking = false;
        fadeSongVolume(1.0, 0.4); // 0.4초 동안 100% 볼륨으로 부드럽게 페이드 인
      }
    }

    function isVocaTrackId(trackId) {
      return /^v\d+$/i.test(String(trackId));
    }

    function getAudioUrlForTrack(trackId) {
      const idStr = String(trackId);
      if (isVocaTrackId(idStr)) {
        const numPart = idStr.slice(1).padStart(3, '0');
        const audioBase = (typeof R2_AUDIO_BASE !== 'undefined')
          ? R2_AUDIO_BASE
          : R2_SONGS_BASE.replace(/\/songs\/?$/, '/audio');
        return `${audioBase}/${numPart}.mp3`;
      } else {
        const fileName = (typeof SONGS_DB !== 'undefined') ? SONGS_DB[Number(idStr)] : null;
        if (!fileName) return '';
        return `${R2_SONGS_BASE}/${encodeURIComponent(fileName)}`;
      }
    }

    function preloadPageTracks(pageNum) {
      if (!pageNum) return;
      const list = songSpotsData[String(pageNum)] || [];
      list.forEach(spot => {
        const url = getAudioUrlForTrack(spot.track);
        if (url && !preloadedAudioUrls.has(url)) {
          preloadedAudioUrls.add(url);
          fetch(url, { mode: 'cors', cache: 'force-cache' }).catch(() => {
            preloadedAudioUrls.delete(url);
          });
        }
      });
    }

    function updateSyncBadge(state, text) {
      const badge = document.getElementById('sync-status-badge');
      if (!badge) return;
      if (state === 'saving') {
        badge.className = 'ml-1 px-2 py-0.5 rounded bg-amber-100 text-amber-800 font-bold text-[10px] flex items-center gap-1';
        badge.innerHTML = `<i class="fa-solid fa-rotate fa-spin"></i><span>${text || '저장 중...'}</span>`;
      } else if (state === 'error') {
        badge.className = 'ml-1 px-2 py-0.5 rounded bg-rose-100 text-rose-800 font-bold text-[10px] flex items-center gap-1';
        badge.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><span>${text || '오프라인 저장됨'}</span>`;

    async function loadSpotsFromCloud() {
      const localBackup = JSON.parse(localStorage.getItem('dwe_song_circles') || 'null');
      if (localBackup) {
        songSpotsData = { ...songSpotsData, ...localBackup };
      }
      if (!SPOTS_SYNC_URL) return;

      try {
        const res = await fetch(`${SPOTS_SYNC_URL}?t=${Date.now()}`, { cache: 'no-store' });
        if (res.ok) {
          const cloudData = await res.json();
          if (cloudData && typeof cloudData === 'object' && Object.keys(cloudData).length > 0) {
            songSpotsData = cloudData;
            localStorage.setItem('dwe_song_circles', JSON.stringify(songSpotsData));
            updateSyncBadge('saved', '클라우드 동기화됨');
          } else if (Object.keys(songSpotsData).length > 0) {
            await saveSpotsToCloud();
          }
        }
      } catch (e) {
        console.warn('클라우드 동기화 로드 실패:', e);
        updateSyncBadge('error', '로컬 모드');
      }
    }

    async function saveSpotsToCloud() {
      localStorage.setItem('dwe_song_circles', JSON.stringify(songSpotsData));
      if (!SPOTS_SYNC_URL) return;

      updateSyncBadge('saving', '클라우드 저장 중...');
      try {
        const res = await fetch(SPOTS_SYNC_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(songSpotsData)
        });
        if (res.ok) {
          updateSyncBadge('saved', '클라우드 저장 완료');
        } else {
          updateSyncBadge('error', '서버 응답 오류');
        }
      } catch (e) {
        console.warn('클라우드 자동 저장 실패:', e);
        updateSyncBadge('error', '로컬 임시저장됨');
      }
    }

    /* ==========================================
       초고해상도 원본 PDF 크롭 + 1:1 정사각형 파란원 OCR
       ========================================== */
    async function ensureOcrWorker() {
      if (ocrWorker) return ocrWorker;
      if (typeof Tesseract === 'undefined') return null;
      ocrWorker = await Tesseract.createWorker('eng');
      await ocrWorker.setParameters({
        tessedit_char_whitelist: '0123456789',
        tessedit_pageseg_mode: '7'
      });
      return ocrWorker;
    }

    async function detectCardNumberFromCorner(pageNum, centerXPercent, centerYPercent) {
      try {
        if (!pdfDoc) return '';
        const page = await pdfDoc.getPage(pageNum);
        const hiViewport = page.getViewport({ scale: 3.5 });
        const hiCanvas = document.createElement('canvas');
        hiCanvas.width = Math.floor(hiViewport.width);
        hiCanvas.height = Math.floor(hiViewport.height);
        const hiCtx = hiCanvas.getContext('2d');
        await page.render({ canvasContext: hiCtx, viewport: hiViewport }).promise;

        const cardCenterX = (centerXPercent / 100) * hiCanvas.width;
        const cardCenterY = (centerYPercent / 100) * hiCanvas.height;
        const cardWidthPx = (rectW / 100) * hiCanvas.width;
        const cardHeightPx = (rectH / 100) * hiCanvas.width;

        const cardRightX = cardCenterX + (cardWidthPx / 2);
        const cardTopY = cardCenterY - (cardHeightPx / 2);

        const badgeBoxPx = Math.round(hiCanvas.width * 0.036);
        const marginRightPx = Math.round(hiCanvas.width * 0.002);
        const marginTopPx = Math.round(hiCanvas.width * 0.002);

        const sx = Math.max(0, Math.round(cardRightX - badgeBoxPx - marginRightPx));
        const sy = Math.max(0, Math.round(cardTopY + marginTopPx));
        const sw = Math.min(hiCanvas.width - sx, badgeBoxPx);
        const sh = Math.min(hiCanvas.height - sy, badgeBoxPx);

        const previewCanvas = document.getElementById('ocr-preview-canvas');
        previewCanvas.classList.remove('hidden');
        const pCtx = previewCanvas.getContext('2d');
        pCtx.clearRect(0, 0, previewCanvas.width, previewCanvas.height);
        pCtx.drawImage(hiCanvas, sx, sy, sw, sh, 0, 0, previewCanvas.width, previewCanvas.height);

        const worker = await ensureOcrWorker();
        if (!worker) return '';

        const scale = 4;
        const pad = 24;
        const procCanvas = document.createElement('canvas');
        procCanvas.width = Math.round(sw * scale) + pad * 2;
        procCanvas.height = Math.round(sh * scale) + pad * 2;
        const ctx = procCanvas.getContext('2d');

        const thresholds = [165, 140, 190];
        for (const thresh of thresholds) {
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(0, 0, procCanvas.width, procCanvas.height);
          ctx.drawImage(hiCanvas, sx, sy, sw, sh, pad, pad, Math.round(sw * scale), Math.round(sh * scale));

          const imgData = ctx.getImageData(pad, pad, Math.round(sw * scale), Math.round(sh * scale));
          const d = imgData.data;
          for (let i = 0; i < d.length; i += 4) {
            const r = d[i], g = d[i + 1], b = d[i + 2];
            const isWhiteDigit = (r > thresh && g > thresh && b > thresh);
            const val = isWhiteDigit ? 0 : 255;
            d[i] = d[i + 1] = d[i + 2] = val;
          }
          ctx.putImageData(imgData, pad, pad);

          const { data: { text } } = await worker.recognize(procCanvas);
          const digits = (text || '').replace(/\D/g, '');
          if (digits) {
            const num = parseInt(digits, 10);
            if (num >= 1 && num <= 510) {
              return `v${String(num).padStart(3, '0')}`;
            }
          }
        }
        return '';
      } catch (e) {
        console.warn('카드 번호 OCR 실패:', e);
        return '';
      }
    }

    async function init() {
      try {
        await loadSpotsFromCloud();
        pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;
        totalPages = pdfDoc.numPages;

    async function renderCurrentView() {
      if (!pdfDoc || isRendering) return;
      isRendering = true;
      try {
        const container = document.getElementById('viewer-container');
        // 책 좌우에 밀착 배치된 넘김 버튼 공간(약 96px)을 고려해 여백 계산
        const availW = Math.max(100, container.clientWidth - (isFullscreenMode ? 88 : 112));
        const availH = Math.max(100, container.clientHeight - (isFullscreenMode ? 16 : 24));
        const leftBox = document.getElementById('left-page-box');
        const rightBox = document.getElementById('right-page-box');

        let leftPageNum = null, rightPageNum = null;
        if (!isSpreadMode) {
          leftPageNum = currentPage;
        } else if (hasCoverPage) {
          if (currentPage === 1) { rightPageNum = 1; }
          else {
            leftPageNum = (currentPage % 2 === 0) ? currentPage : currentPage - 1;
            rightPageNum = (leftPageNum + 1 <= totalPages) ? leftPageNum + 1 : null;
          }
        } else {
          leftPageNum = (currentPage % 2 !== 0) ? currentPage : currentPage - 1;
          rightPageNum = (leftPageNum + 1 <= totalPages) ? leftPageNum + 1 : null;
        }

        currentLeftPageNum = leftPageNum;
        currentRightPageNum = rightPageNum;
        tocAudioMode = false;

        const samplePage = await pdfDoc.getPage(leftPageNum || rightPageNum || 1);
        const baseVp = samplePage.getViewport({ scale: 1.0 });
        const scale = Math.min((isSpreadMode ? availW / 2 : availW) / baseVp.width, availH / baseVp.height);
        const renderedW = Math.floor(baseVp.width * scale);
        const renderedH = Math.floor(baseVp.height * scale);

        if (leftPageNum) {
          leftBox.style.display = 'block'; leftBox.style.visibility = 'visible';
          leftBox.className = isSpreadMode ? 'page-wrapper rounded-l-md overflow-hidden book-spine-left' : 'page-wrapper rounded-md overflow-hidden shadow-lg';
          await renderSinglePage(leftPageNum, 'canvas-left', 'links-left', 'songs-left', scale);
          preloadPageTracks(leftPageNum);
        } else if (isSpreadMode && rightPageNum === 1) {
          leftBox.style.display = 'block'; leftBox.style.visibility = 'hidden';
          leftBox.style.width = `${renderedW}px`; leftBox.style.height = `${renderedH}px`;
        } else {
          leftBox.style.display = 'none';
        }

        if (rightPageNum) {
          rightBox.style.display = 'block';
          rightBox.className = (isSpreadMode && !leftPageNum)
            ? 'page-wrapper rounded-md overflow-hidden'
            : 'page-wrapper rounded-r-md overflow-hidden book-spine-right border-l border-slate-200';
          await renderSinglePage(rightPageNum, 'canvas-right', 'links-right', 'songs-right', scale);
          preloadPageTracks(rightPageNum);
        } else {
          rightBox.style.display = 'none';
        }

        // 현재 펼쳐진 양면 중 지정 목차 페이지(TOC_PAGES)가 포함되어 있는지 확인
        const isTocView = (leftPageNum && TOC_PAGES.has(leftPageNum)) || (rightPageNum && TOC_PAGES.has(rightPageNum));
        updateTocModeUI(isTocView);
        updateBottomNavUI();
      } finally {
        isRendering = false;
      }
    }

    async function renderSinglePage(pageNum, canvasId, linkLayerId, songLayerId, scale) {
      const page = await pdfDoc.getPage(pageNum);
      const viewport = page.getViewport({ scale });
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      const floorW = Math.floor(viewport.width), floorH = Math.floor(viewport.height);

      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = `${floorW}px`; canvas.style.height = `${floorH}px`;
      canvas.parentElement.style.width = `${floorW}px`; canvas.parentElement.style.height = `${floorH}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      await page.render({ canvasContext: ctx, viewport }).promise;

      const linkLayer = document.getElementById(linkLayerId);
      linkLayer.innerHTML = '';
      linkLayer.style.width = `${floorW}px`; linkLayer.style.height = `${floorH}px`;

      const annotations = await page.getAnnotations();
      annotations.forEach(item => {
        if (item.subtype !== 'Link') return;
        const rect = pdfjsLib.Util.normalizeRect(item.rect);
        const viewRect = viewport.convertToViewportRectangle(rect);
        const a = document.createElement('a');
        a.style.left = `${Math.min(viewRect[0], viewRect[2])}px`;
        a.style.top = `${Math.min(viewRect[1], viewRect[3])}px`;
        a.style.width = `${Math.abs(viewRect[2] - viewRect[0])}px`;
        a.style.height = `${Math.abs(viewRect[3] - viewRect[1])}px`;

        if (item.url) {
          if (/^https?:\/\//i.test(item.url)) {
            a.href = item.url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            linkLayer.appendChild(a);
          }
        } else if (item.dest) {
          a.href = 'javascript:void(0)';
          a.onclick = async (e) => { e.preventDefault(); e.stopPropagation(); await navigateToDestination(item.dest); };
          linkLayer.appendChild(a);
        }
      });

      renderSongCircles(pageNum, songLayerId, floorW, floorH);
    }

      const toggleBtn = document.getElementById('btn-toc-mode-toggle');

      if (!isTocPage) {
        toggleBtn.classList.add('hidden');
        spread.classList.remove('toc-audio-off', 'toc-audio-on');

      }

      toggleBtn.classList.remove('hidden');
      if (tocAudioMode) {
        spread.classList.remove('toc-audio-off');
        spread.classList.add('toc-audio-on');
        toggleBtn.className = 'px-2.5 py-1 rounded-lg bg-blue-600 text-white border border-blue-700 text-xs font-bold shadow-xs transition';
        toggleBtn.innerHTML = `<i class="fa-solid fa-volume-high mr-1"></i><span>음원 ON</span>`;
      } else {
        spread.classList.remove('toc-audio-on');
        spread.classList.add('toc-audio-off');
        toggleBtn.className = 'px-2.5 py-1 rounded-lg bg-slate-200 text-slate-700 border border-slate-300 text-xs font-bold shadow-xs transition';
        toggleBtn.innerHTML = `<i class="fa-solid fa-volume-xmark mr-1"></i><span>음원 OFF</span>`;
      }

    function moveGhost(e, side) {
      if (!isSpotEditMode) return;
      const ghost = document.getElementById(`ghost-${side}`);
      if (!ghost) return;
      const rect = e.currentTarget.getBoundingClientRect();

      let wPx, hPx;
      if (currentShape === 'circle') {
        wPx = Math.round(rect.width * (circleSize / 100));
        hPx = wPx;
        ghost.className = 'ghost-guide shape-circle';
      } else {
        wPx = Math.round(rect.width * (rectW / 100));
        hPx = Math.round(rect.width * (rectH / 100));
        ghost.className = 'ghost-guide shape-rect';
      }

      ghost.style.display = 'block';
      ghost.style.width = `${wPx}px`;
      ghost.style.height = `${hPx}px`;
      ghost.style.left = `${e.clientX - rect.left}px`;
      ghost.style.top = `${e.clientY - rect.top}px`;
    }

    function hideGhost(side) {
      const ghost = document.getElementById(`ghost-${side}`);
      if (ghost) ghost.style.display = 'none';
    }

    function renderSongCircles(pageNum, layerId, pageW, pageH) {
      const layer = document.getElementById(layerId);
      layer.innerHTML = '';
      layer.style.width = `${pageW}px`; layer.style.height = `${pageH}px`;

      const list = songSpotsData[String(pageNum)] || [];
      list.forEach((spot, idx) => {
        const isCircle = (spot.shape || 'circle') === 'circle';
        const spotKey = `${pageNum}-${idx}`;
        const btn = document.createElement('div');
        btn.className = `song-spot ${isCircle ? 'shape-circle' : 'shape-rect'}`;

        // 노래 채널 재생 중 표시 vs 보카 채널 재생 중 표시 분리
        if (activeSongSpotKey === spotKey && !songAudioEl.paused) {
          btn.classList.add('playing');
        }
        if (activeVocaSpotKey === spotKey && !vocaAudioEl.paused) {
          btn.classList.add('playing-voca');
        }

        let wPx, hPx;
        if (isCircle) {
          const widthPct = spot.w ? spot.w : (spot.r ? spot.r * 2 : 12.0);
          wPx = Math.round(pageW * (widthPct / 100));
          hPx = wPx;
        } else {
          const widthPct = spot.w || 26.0;
          const heightPct = spot.h ? spot.h : (widthPct * 0.46);
          wPx = Math.round(pageW * (widthPct / 100));
          hPx = Math.round(pageW * (heightPct / 100));
        }

        btn.style.left = `${spot.x}%`; btn.style.top = `${spot.y}%`;
        btn.style.width = `${wPx}px`; btn.style.height = `${hPx}px`;

        if (isSpotEditMode) {
          const isVoca = isVocaTrackId(spot.track);
          const badgeColor = isVoca ? 'text-emerald-800' : 'text-blue-900';
          btn.innerHTML = `<span class="text-[10px] font-mono font-black ${badgeColor} bg-white/95 px-1.5 rounded-full shadow-xs">${spot.track}</span>`;
        }

        btn.onclick = (e) => {
          e.preventDefault();
          e.stopPropagation();
          if (isSpotEditMode) openSpotModalEdit(pageNum, idx);
          else playOrPauseR2Song(spot.track, spotKey);
        };
        layer.appendChild(btn);
      });
    }

    function getAllAudioItems() {
      const items = [];
      if (typeof SONGS_DB !== 'undefined') {
        Object.entries(SONGS_DB).forEach(([num, fileName]) => {
          items.push({
            id: String(num),
            type: 'song',
            label: `#${num}`,
            title: fileName.replace(/\.mp3$/i, '')
          });
        });
      }
      for (let i = 1; i <= 510; i++) {
        const padded = String(i).padStart(3, '0');
        items.push({
          id: `v${padded}`,
          type: 'voca',
          label: `v${padded}`,
          title: `VOCA 카드 ${padded}번 (${padded}.mp3)`
        });
      }
      return items;
    }

    async function openSpotModalNew(e, side) {
      if (!isSpotEditMode) return;
      const pageNum = (side === 'left') ? currentLeftPageNum : currentRightPageNum;
      if (!pageNum) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const xPct = Number((((e.clientX - rect.left) / rect.width) * 100).toFixed(2));
      const yPct = Number((((e.clientY - rect.top) / rect.height) * 100).toFixed(2));

      pendingSpotContext = {
        pageNum,
        x: xPct,
        y: yPct,
        editIndex: null
      };
      document.getElementById('modal-title').textContent = `${pageNum}페이지 - 새 음원 연결`;
      document.getElementById('modal-footer-delete').classList.add('hidden');
      document.getElementById('ocr-preview-canvas').classList.add('hidden');

      showModalWithFilter('');

      if (currentShape === 'rect') {
        const ocrTag = document.getElementById('ocr-status-tag');
        ocrTag.classList.remove('hidden');
        ocrTag.textContent = '카드 번호 읽는 중...';

        const detectedId = await detectCardNumberFromCorner(pageNum, xPct, yPct);
        ocrTag.classList.add('hidden');

        if (detectedId && pendingSpotContext) {
          const input = document.getElementById('song-search-input');
          input.value = detectedId;
          filterSongList(detectedId);
          input.focus();
          input.select();
        }
      }
    }

    function openSpotModalEdit(pageNum, idx) {
      const spot = songSpotsData[String(pageNum)][idx];
      pendingSpotContext = { pageNum, x: spot.x, y: spot.y, editIndex: idx };
      document.getElementById('modal-title').textContent = `수정/삭제 (현재: ${spot.track})`;
      document.getElementById('modal-footer-delete').classList.remove('hidden');
      document.getElementById('ocr-preview-canvas').classList.add('hidden');
      document.getElementById('ocr-status-tag').classList.add('hidden');
      showModalWithFilter('');
    }

    function showModalWithFilter(query) {
      const modal = document.getElementById('song-modal');
      const input = document.getElementById('song-search-input');
      modal.classList.remove('hidden');
      input.value = query;
      filterSongList(query);
      setTimeout(() => input.focus(), 50);
    }

    function closeSongModal() {
      document.getElementById('song-modal').classList.add('hidden');
      pendingSpotContext = null;
    }

    function filterSongList(query) {
      const container = document.getElementById('song-search-results');
      if (!container) return;
      const rawQ = String(query || '').trim().toLowerCase();
      const compactQ = rawQ.replace(/\s+/g, '');
      container.innerHTML = '';

      const allItems = getAllAudioItems();
      let matchCount = 0;

      for (const item of allItems) {
        const lowerId = item.id.toLowerCase();
        const lowerTitle = item.title.toLowerCase();
        const compactTitle = lowerTitle.replace(/\s+/g, '');

        const isMatch = !rawQ
          || lowerId === rawQ
          || lowerId.includes(rawQ)
          || lowerTitle.includes(rawQ)
          || compactTitle.includes(compactQ);

        if (isMatch) {
          matchCount++;
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'w-full text-left px-3 py-2 text-xs hover:bg-blue-50 flex items-center gap-2 transition';
          btn.dataset.track = item.id;

          const badge = item.type === 'voca'
            ? `<span class="px-1.5 py-0.5 rounded bg-emerald-100 text-emerald-700 font-mono font-black text-[10px] shrink-0">${item.label}</span>`
            : `<span class="px-1.5 py-0.5 rounded bg-blue-100 text-blue-700 font-mono font-black text-[10px] shrink-0">${item.label}</span>`;

          btn.innerHTML = `${badge}<span class="truncate text-slate-700 font-medium">${item.title}</span>`;
          btn.onclick = () => assignSongToSpot(item.id);
          container.appendChild(btn);

          if (matchCount >= 60) break;
        }
      }

      if (matchCount === 0) {
        container.innerHTML = `<div class="py-6 text-center text-xs text-slate-400">일치하는 음원이 없습니다.</div>`;
      }
    }

    function selectFirstFilteredSong() {
      const first = document.querySelector('#song-search-results button');
      if (first) assignSongToSpot(first.dataset.track);
    }

    function assignSongToSpot(trackId) {
      if (!pendingSpotContext) return;
      const pageKey = String(pendingSpotContext.pageNum);
      if (!songSpotsData[pageKey]) songSpotsData[pageKey] = [];

      const normalizedTrack = isVocaTrackId(trackId) ? String(trackId).toLowerCase() : Number(trackId);

      if (pendingSpotContext.editIndex !== null) {
        songSpotsData[pageKey][pendingSpotContext.editIndex].track = normalizedTrack;
      } else {
        const newSpot = {
          track: normalizedTrack,
          x: pendingSpotContext.x,
          y: pendingSpotContext.y,
          shape: currentShape,
          w: (currentShape === 'circle') ? circleSize : rectW
        };
        if (currentShape === 'rect') {
          newSpot.h = rectH;
        }
        songSpotsData[pageKey].push(newSpot);
      }
      preloadPageTracks(pendingSpotContext.pageNum);
      closeSongModal();
      refreshAllSongLayers();
      saveSpotsToCloud();
    }

    function deleteCurrentSpot() {
      if (!pendingSpotContext || pendingSpotContext.editIndex === null) return;
      const pageKey = String(pendingSpotContext.pageNum);
      songSpotsData[pageKey].splice(pendingSpotContext.editIndex, 1);
      closeSongModal();
      refreshAllSongLayers();
      saveSpotsToCloud();
    }

    function toggleSpotEditMode() {
      isSpotEditMode = !isSpotEditMode;
      const spread = document.getElementById('book-spread');
      const btn = document.getElementById('btn-edit-spots');
      const controls = document.getElementById('edit-controls');

      spread.classList.toggle('edit-active', isSpotEditMode);
      controls.classList.toggle('hidden', !isSpotEditMode);
      btn.className = isSpotEditMode
        ? 'px-2.5 py-1 rounded-lg bg-pink-600 text-white border border-pink-600 text-xs font-bold transition'
        : 'px-2.5 py-1 rounded-lg bg-slate-100 text-slate-700 border border-slate-200 text-xs font-bold hover:bg-slate-200 transition';

      if (isSpotEditMode) {
        ensureOcrWorker();
      } else {
        hideGhost('left');
        hideGhost('right');
      }
      refreshAllSongLayers();
    }

    function refreshAllSongLayers() {
      const leftC = document.getElementById('canvas-left');
      const rightC = document.getElementById('canvas-right');
      if (currentLeftPageNum) renderSongCircles(currentLeftPageNum, 'songs-left', parseInt(leftC.style.width), parseInt(leftC.style.height));
      if (currentRightPageNum) renderSongCircles(currentRightPageNum, 'songs-right', parseInt(rightC.style.width), parseInt(rightC.style.height));
    }

    /* ==========================================
       2채널 오디오 재생 (노래 + 보카 동시 송출 & 볼륨 덕킹)
       ========================================== */
    function playOrPauseR2Song(trackId, spotKey) {
      const targetUrl = getAudioUrlForTrack(trackId);
      if (!targetUrl) return;

      if (isVocaTrackId(trackId)) {
        // 보카(VOCA) 채널 제어
        if (activeVocaSpotKey === spotKey && vocaAudioEl.src) {
          if (vocaAudioEl.paused) {
            duckSongForVoca();
            vocaAudioEl.play();
          } else {
            vocaAudioEl.pause();
            restoreSongAfterVoca();
          }
          refreshAllSongLayers();
          return;
        }

        activeVocaSpotKey = spotKey;
        duckSongForVoca();
        vocaAudioEl.src = targetUrl;
        vocaAudioEl.play().catch(err => {
          console.warn('보카 재생 오류:', err);
          restoreSongAfterVoca();
        });
        refreshAllSongLayers();
      } else {
        // 노래(SA) 채널 제어
        initSongGainDucking();
        if (activeSongSpotKey === spotKey && songAudioEl.src) {
          if (songAudioEl.paused) {
            songAudioEl.play();
          } else {
            songAudioEl.pause();
          }
          refreshAllSongLayers();
          return;
        }

        activeSongSpotKey = spotKey;
        // 보카가 동시에 재생 중이면 덕킹 상태 유지, 아니면 100% 볼륨으로 시작
        if (!vocaAudioEl.paused) {
          isSongDucking = true;
          fadeSongVolume(0.15, 0.1);
        } else {
          isSongDucking = false;
          fadeSongVolume(1.0, 0.1);
        }
        songAudioEl.src = targetUrl;
        songAudioEl.play().catch(err => console.warn('노래 재생 오류:', err));
        refreshAllSongLayers();
      }
    }

    songAudioEl.addEventListener('ended', () => {
      activeSongSpotKey = null;
      isSongDucking = false;
      refreshAllSongLayers();
    });

    vocaAudioEl.addEventListener('ended', () => {
      activeVocaSpotKey = null;
      restoreSongAfterVoca();
      refreshAllSongLayers();
    });

    async function navigateToDestination(dest) {
      try {
        const destArray = (typeof dest === 'string') ? await pdfDoc.getDestination(dest) : dest;
        if (Array.isArray(destArray) && destArray[0]) {
          const idx = (typeof destArray[0] === 'object') ? await pdfDoc.getPageIndex(destArray[0]) : destArray[0];
          currentPage = idx + 1;
          await renderCurrentView();
        }
      } catch (e) {}
    }

    function prevPage() {
      if (currentPage <= 1) return;
      if (!isSpreadMode) currentPage--;
      else currentPage = hasCoverPage ? ((currentPage <= 3) ? 1 : currentPage - 2) : ((currentPage <= 2) ? 1 : currentPage - 2);
      renderCurrentView();
    }

    function nextPage() {
      if (currentPage >= totalPages) return;
      if (!isSpreadMode) currentPage++;
      else currentPage = (hasCoverPage && currentPage === 1) ? 2 : Math.min(totalPages, currentPage + 2);
      renderCurrentView();
    }

    function goToPage(val) {
      const num = parseInt(val, 10);
      if (!isNaN(num) && num >= 1 && num <= totalPages) { currentPage = num; renderCurrentView(); }
    }

    function toggleSpreadMode() {
      isSpreadMode = !isSpreadMode;
      document.getElementById('label-spread').textContent = isSpreadMode ? '2쪽보기' : '1쪽보기';
      renderCurrentView();
    }

    function toggleCoverMode() {
      hasCoverPage = !hasCoverPage;
      document.getElementById('label-cover').textContent = hasCoverPage ? '표지포함' : '표지미포함';
      renderCurrentView();
    }

    function toggleFullscreen(forceState) {
      const target = (typeof forceState === 'boolean') ? forceState : !isFullscreenMode;
      if (target) {
        if (document.documentElement.requestFullscreen) document.documentElement.requestFullscreen().catch(() => applyFullscreenUI(true));
        else applyFullscreenUI(true);
      } else {
        if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(() => applyFullscreenUI(false));
        else applyFullscreenUI(false);
      }
    }

    function applyFullscreenUI(isFs) {
      isFullscreenMode = isFs;
      document.getElementById('top-panel').classList.toggle('hidden', isFs);
      document.getElementById('top-exit-hotspot').classList.toggle('hidden', !isFs);
      document.getElementById('btn-floating-exit').classList.toggle('hidden', !isFs);
      document.getElementById('fs-icon').className = isFs ? "fa-solid fa-compress" : "fa-solid fa-expand";
      setTimeout(renderCurrentView, 120);
    }

    document.addEventListener('fullscreenchange', () => applyFullscreenUI(!!document.fullscreenElement));

    function updateBottomNavUI() {
      document.getElementById('current-page-num').textContent = currentPage;
      document.getElementById('page-slider').value = currentPage;
      document.getElementById('direct-page-input').value = currentPage;
    }

    let sliderDebounce;
    function onSliderInput(val) {
      document.getElementById('current-page-num').textContent = val;
      document.getElementById('direct-page-input').value = val;
      clearTimeout(sliderDebounce);
      sliderDebounce = setTimeout(() => goToPage(val), 70);
    }

    let hideBottomTimer;
    function toggleBottomNavActive() {
      const bar = document.getElementById('bottom-nav-bar');
      bar.classList.add('active');
      clearTimeout(hideBottomTimer);
      hideBottomTimer = setTimeout(() => bar.classList.remove('active'), 3500);
    }

    window.addEventListener('keydown', (e) => {
      if (!document.getElementById('song-modal').classList.contains('hidden')) {
        if (e.key === 'Escape') closeSongModal();
        return;
      }
      if (e.key === 'ArrowLeft') prevPage();
      if (e.key === 'ArrowRight') nextPage();
      if (e.key === 'Escape' && isFullscreenMode) toggleFullscreen(false);
    });

    let touchStartX = 0;
    window.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
    window.addEventListener('touchend', e => {
      const diff = e.changedTouches[0].screenX - touchStartX;
      if (Math.abs(diff) > 60) { if (diff < 0) nextPage(); else prevPage(); }
    }, { passive: true });

    let resizeTimer;
    window.addEventListener('resize', () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(renderCurrentView, 150); });

    window.onload = init;
  </script>
</body>
</html>
